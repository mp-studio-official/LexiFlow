# LexiFlow – die Auslieferung für Pilot 0.1.
#
# ## Warum eine eigene Datei neben `deploy.yml`
#
# `deploy.yml` liefert `main` aus. Der Pilot läuft auf einem eigenen Zweig
# und soll eine eigene Adresse haben – `main` bleibt unangetastet, bis der
# Pilot abgenommen ist. Beides in eine Datei zu legen hieße, zwei Ziele über
# eine Bedingung zu unterscheiden, und genau dort passiert eines Tages die
# Verwechslung, die man nicht zurücknimmt.
#
# ## Warum nur auf Zuruf
#
# `workflow_dispatch` und **kein** `push`. Ein Pilot wird nicht ausgeliefert,
# weil jemand committet hat, sondern weil jemand sich dafür entschieden hat.
# Solange Marc nicht deployen will, läuft diese Datei nie – sie liegt bereit
# und tut nichts.
#
# ## Warum ein zweites Projekt und nicht ein zweiter Pfad
#
# GitHub Pages liefert je Projekt **eine** Seite aus. Eine wirklich getrennte
# Adresse braucht deshalb ein zweites Projekt (oder eine eigene Domain).
# Dieser Ablauf baut hier und schiebt das Ergebnis dorthin; welche Werte dafür
# zu hinterlegen sind, steht in `docs/pilot-auslieferung.md`.
#
# ## Was er nicht tut
#
# Er fasst `main` nicht an, legt kein Etikett an und schreibt nichts in die
# Datenbank. Migrationen werden von Hand angewandt, nicht von einem Ablauf –
# das steht in den Abnahmedateien und bleibt so.

name: Pilot 0.1 ausliefern

on:
  workflow_dispatch:
    inputs:
      bestaetigung:
        description: 'Zum Ausliefern genau „pilot" eintippen.'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: pilot
  cancel-in-progress: false

env:
  LEXIFLOW_CI: '1'

jobs:
  pruefen:
    name: Die vollständige Prüfkette
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Die Bestätigung
        # Ein Tippfehler ist hier billiger als ein Deployment.
        run: |
          if [ "${{ github.event.inputs.bestaetigung }}" != "pilot" ]; then
            echo "Ohne die Bestätigung „pilot" wird nicht ausgeliefert."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:portable
      - run: npm run e2e:portal

      - name: Portable Dateien und Größenwacht
        run: npm run build:portable && npm run verify:portable

  ausliefern:
    name: Auf die Pilotadresse
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Frisch ausgecheckt. Kein Artefakt aus dem Prüfauftrag – dort ist eine
      # Testfassung gebaut worden.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Beide Auslieferungen bauen
        run: npm run build
        env:
          # Der Grundpfad der **Pilotadresse**, nicht der von `main`.
          LEXIFLOW_BASE: /${{ vars.LEXIFLOW_PILOT_REPO }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Ausdrücklich **nicht** gesetzt: VITE_LEXIFLOW_FAKE_CLOUD.

      - name: Der Riegel vor dem Netz
        # Sucht die Testfassung, Geheimnisse, Pfade außerhalb des Grundpfads –
        # und seit Pilot 0.1 auch das Pilotband.
        run: npm run verify:deploy
        env:
          LEXIFLOW_BASE: /${{ vars.LEXIFLOW_PILOT_REPO }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}

      - name: In das Pilotprojekt schieben
        env:
          TOKEN: ${{ secrets.LEXIFLOW_PILOT_TOKEN }}
          ZIEL: ${{ vars.LEXIFLOW_PILOT_REPO }}
          BESITZER: ${{ vars.LEXIFLOW_PILOT_OWNER }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          test -n "$ZIEL"
          test -n "$BESITZER"
          cd dist
          touch .nojekyll
          git init -q .
          git config user.name "LexiFlow Pilot"
          git config user.email "pilot@example.invalid"
          git add -A
          git commit -q -m "Pilot 0.1 aus ${GITHUB_SHA}"
          # `--force`: Der Zielzweig trägt nur die Auslieferung und keine
          # Geschichte, die jemand bräuchte. Was dort stand, war der
          # vorherige Stand derselben Auslieferung.
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${BESITZER}/${ZIEL}.git" HEAD:gh-pages
          echo "Geschoben nach ${BESITZER}/${ZIEL} (gh-pages)."
